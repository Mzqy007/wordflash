<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词闪过">
<title>单词闪过</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============ 首页 ============ -->
  <section id="scr-home" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1">单词闪过</div>
      <button class="btn ghost" id="btn-home-settings">设置</button>
    </div>

    <div class="hero">
      <div class="k" id="home-kicker">今天还没开始</div>
      <div class="v" id="home-today">0 词</div>
      <button class="btn" id="btn-start">开始今天的学习</button>
      <div class="tiny" id="home-sub" style="opacity:.85;margin-top:10px"></div>
    </div>

    <div class="statgrid" id="home-stats"></div>

    <div class="linkrow">
      <button class="btn ghost small" id="btn-book">生词本</button>
      <button class="btn ghost small" id="btn-drill">加练</button>
      <button class="btn ghost small" id="btn-go-stats">看统计</button>
    </div>
    <div class="tiny muted" style="margin-top:18px;text-align:center">
      数据只存在这台设备的浏览器里 · 记得偶尔导出备份
    </div>
  </section>

  <!-- ============ 词库 ============ -->
  <section id="scr-lib" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1">词库</div>
      <button class="btn ghost small" id="btn-new-deck">+ 新建</button>
    </div>
    <div id="deck-list"></div>
    <div class="linkrow" style="margin-top:14px">
      <button class="btn ghost small" id="btn-lib-book">生词本</button>
    </div>
  </section>

  <!-- ============ 统计 ============ -->
  <section id="scr-stats" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1">统计</div>
    </div>
    <div id="stats-body"></div>
  </section>

  <!-- ============ 我的 ============ -->
  <section id="scr-me" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1">我的</div>
    </div>
    <div id="me-body"></div>
    <div class="card" style="margin-top:12px">
      <div class="spread">
        <div><div class="strong">学习模式</div><div class="tiny muted">背记：先看词，点开释义再自评，不计时；闪过：限时抢答，按反应速度计分</div></div>
      </div>
      <div class="chips" id="me-mode" style="margin-top:10px">
        <button class="chip" data-mode="learn">背记</button>
        <button class="chip" data-mode="flash">闪过</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="strong">数据</div>
      <div class="tiny muted" style="margin-top:2px">导出的是一份 JSON 备份，换设备或升级前建议先导出</div>
      <div class="linkrow" style="margin-top:10px">
        <button class="btn ghost small" id="btn-export">导出备份</button>
        <button class="btn ghost small" id="btn-import">导入备份</button>
        <button class="btn ghost small" id="btn-me-settings">学习设置</button>
      </div>
    </div>
    <div class="tiny muted" style="margin-top:16px;text-align:center">单词闪过 · 纯前端 · 离线可用</div>
    <input type="file" id="file-import" accept=".json" hidden>
  </section>

  <!-- ============ 组设置 ============ -->
  <section id="scr-setup" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1" id="setup-title">设置</div>
      <button class="btn ghost" id="btn-setup-back">返回</button>
    </div>
    <div class="card" id="setup-body"></div>
  </section>

  <!-- ============ 游戏屏 ============ -->
  <section id="scr-game" class="screen">
    <div id="game-wrap" class="game">
      <div class="gbar">
        <span id="gstat" class="mono"></span>
        <span class="gbar-r">
          <button class="btn ghost small" id="btn-swap" title="左右换边">⇄</button>
          <button class="btn ghost small" id="btn-lock" title="锁定横屏">⤢</button>
          <button class="btn ghost small" id="btn-prev" title="回到上一个词">上一词</button>
          <button class="btn ghost small" id="btn-quit">结束本轮</button>
        </span>
      </div>
      <div class="timer"><i id="tbar"></i></div>
      <div class="gmain" id="game-main">
        <div class="gcol gcol-word">
          <div class="qbox" id="qbox">
            <div class="word" id="gword"></div>
            <div class="phon" id="gphon"></div>
            <div class="tag" id="gtag" style="display:none"></div>
          </div>
        </div>
        <div class="gcol gcol-side">
          <div id="reveal-box"></div>
          <button class="btn showans" id="btn-show" style="display:none">显示释义</button>
        </div>
      </div>
      <div class="btns" id="gbtns">
        <button class="big ok" id="btn-know">认识<small>1</small></button>
        <button class="big fuzzy" id="btn-fuzzy">模糊<small>2</small></button>
        <button class="big no" id="btn-no">不认识<small>3</small></button>
      </div>
      <div class="hint" id="ghint">1 认识 · 2 模糊 · 3 不认识 · Esc 结束</div>
    </div>
  </section>

  <!-- ============ 结算页 ============ -->
  <section id="scr-result" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1">本轮结算</div>
      <button class="btn ghost" id="btn-result-home">首页</button>
    </div>
    <div id="result-body"></div>
  </section>

  <!-- ============ 生词本 ============ -->
  <section id="scr-book" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1">生词本</div>
      <button class="btn ghost" id="btn-book-back">返回</button>
    </div>
    <div id="book-body"></div>
  </section>
  <!-- ============ 单词详情 ============ -->
  <section id="scr-word" class="screen">
    <div class="spread" style="margin:6px 2px 14px">
      <div class="h1">单词详情</div>
      <button class="btn ghost" id="btn-word-back">返回</button>
    </div>
    <div id="word-body"></div>
  </section>

  <!-- ============ 底部标签 ============ -->
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="home">学习</button>
    <button class="tab" data-tab="lib">词库</button>
    <button class="tab" data-tab="stats">统计</button>
    <button class="tab" data-tab="me">我的</button>
  </nav>

</div>
<div class="toast" id="toast"></div>
<script src="wordbank.js"></script>
<script src="app.js"></script>
</body>
</html>
